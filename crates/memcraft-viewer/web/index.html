<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MemCraft</title>
  <style>
    html, body { margin: 0; height: 100%; background: #87b8fa; overflow: hidden; }
    #memcraft { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 16px system-ui, sans-serif; color: #234; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="memcraft" tabindex="0"></canvas>
  <div id="loading">Loading world…</div>
  <script type="module">
    import init from './memcraft-viewer.js';
    // Behind a world server (crates/memcraft-server) `api/world` answers: load
    // its world instead of the embedded one, and Save posts to it (see
    // src/server.rs, which reads `window.memcraftServer`). Anywhere else (GitHub
    // Pages, any static server) the probe fails and the viewer is read-only:
    // the embedded world, and a zip to download. Done here, before the viewer
    // starts, as the viewer builds its world synchronously.
    async function probeServer() {
      try {
        const probe = await fetch('api/world', { cache: 'no-store' });
        // Some hosts answer every path with the page itself: it must be the JSON probe.
        if (!probe.ok || !(probe.headers.get('content-type') || '').includes('json')) return;
        const files = await fetch('api/world/files', { cache: 'no-store' });
        if (!files.ok) throw new Error(`api/world/files: ${files.status}`);
        window.memcraftServer = { files: await files.arrayBuffer() };
      } catch (e) {
        console.warn('the world server could not be used; showing the embedded world:', e);
      }
    }
    // Bevy's event loop throws a control-flow "exception" once it takes over; it is not an error.
    probeServer().then(init).catch((e) => { if (!String(e).includes('Using exceptions for control flow')) throw e; });
    // Hide the loading notice once Bevy has started drawing.
    const hide = () => document.getElementById('loading').remove();
    new MutationObserver((_, o) => { o.disconnect(); hide(); })
      .observe(document.getElementById('memcraft'), { attributes: true });
  </script>
</body>
</html>
