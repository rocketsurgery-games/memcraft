[package]
name = "memcraft-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fly through an old Pocket Edition world, natively or in the browser"

[dependencies]
mcpe-world.workspace = true
# The browser's world download is a zip (same minimal build as mcpe2java's).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# 0.19 is the newest Bevy that builds on Rust 1.95 (0.20 needs 1.97.1).
# Only what an unlit vertex-coloured fly-through needs, to keep the wasm small.
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_light",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "std",
    "bevy_winit",
    "multi_threaded",
    "webgl2",
    "x11",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
] }

[build-dependencies]
# Reads the texture PNGs at build time; the atlas is embedded as raw pixels, so
# the viewer itself needs no PNG decoder.
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Bevy's wasm build needs JS randomness, too.
getrandom = { version = "0.3", features = ["wasm_js"] }
# To notice when the browser drops the pointer lock (Esc), which Bevy doesn't report.
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "CssStyleDeclaration", "Document", "Element", "HtmlAnchorElement", "HtmlElement", "Location", "Node", "Url", "Window"] }
# To hand the zip to the browser as a download.
js-sys = "0.3"
wasm-bindgen = "0.2"
