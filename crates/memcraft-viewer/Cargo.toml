[package]
name = "memcraft-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fly through an old Pocket Edition world, natively or in the browser"

[dependencies]
mcpe-world.workspace = true
# 0.19 is the newest Bevy that builds on Rust 1.95 (0.20 needs 1.97.1).
# Only what an unlit vertex-coloured fly-through needs, to keep the wasm small.
bevy = { version = "0.19.1", default-features = false, features = [
    "default_app",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_camera",
    "bevy_color",
    "bevy_image",
    "bevy_light",
    "bevy_mesh",
    "bevy_shader",
    "bevy_material",
    "bevy_text",
    "bevy_window",
    "free_camera",
    "std",
    "bevy_winit",
    "multi_threaded",
    "webgl2",
    "x11",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Bevy's wasm build needs JS randomness, too.
getrandom = { version = "0.3", features = ["wasm_js"] }
