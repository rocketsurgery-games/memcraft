[package]
name = "memcraft-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Serves the memcraft web viewer and one world directory, and saves the viewer's edits to it"

[dependencies]
mcpe-world.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7", features = ["fs"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
