# Builds the browser version of memcraft-viewer and publishes it on GitHub Pages
# (https://rocketsurgery-games.github.io/memcraft/) by force-pushing the build
# to the `gh-pages` branch, which Pages serves (Settings -> Pages -> Deploy from
# a branch: gh-pages, / (root)). Only the latest build is kept on that branch.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen-cli (the version in Cargo.lock) and wasm-opt
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          curl -sSfL "https://github.com/rustwasm/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "wasm-bindgen-$version-x86_64-unknown-linux-musl/wasm-bindgen"
          sudo apt-get update -qq && sudo apt-get install -y -qq binaryen
          wasm-bindgen --version && wasm-opt --version
      - run: sh crates/memcraft-viewer/web/build.sh
      - name: Publish to gh-pages
        working-directory: crates/memcraft-viewer/web/dist
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "memcraft-viewer web build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
